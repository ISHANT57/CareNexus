      summary: List uploaded files
      operationId: listFiles
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedFiles"
  /api/files/{id}:
    get:
      summary: Get file metadata
      operationId: getFile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: File metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUpload"
    delete:
      summary: Delete a file
      operationId: deleteFile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: File deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/files/{fileKey}/download:
    get:
      summary: Download a file
      operationId: downloadFile
      security:
        - bearerAuth: []
      parameters:
        - name: fileKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
