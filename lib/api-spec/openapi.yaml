      type: object
      required: [id, action, entity, createdAt]
      properties:
        id:
          type: string
        action:
          type: string
        entity:
          type: string
        entityId:
          type: ["string", "null"]
        changes:
          type: object
        createdAt:
          type: string
        user:
          $ref: "#/components/schemas/User"

    AuditLogList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        meta:
          $ref: "#/components/schemas/Meta"

    # ── Reports ─────────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required: [totalPatients, activePatients, totalUsers, totalClinics, totalPrograms, newPatientsThisMonth, pendingCommunications]
      properties:
        totalPatients:
          type: integer
        activePatients:
          type: integer
        totalUsers:
          type: integer
        totalClinics:
          type: integer
        totalPrograms:
          type: integer
        newPatientsThisMonth:
          type: integer
        pendingCommunications:
          type: integer

    StatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: integer

    ProgramCount:
      type: object
      required: [programId, programName, count]
      properties:
        programId:
          type: string
        programName:
          type: string
        count:
          type: integer
    FileUpload:
      type: object
      required: [id, tenantId, patientId, uploaderId, fileKey, fileUrl, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        uploaderId:
          type: string
          format: uuid
        fileKey:
          type: string
        fileUrl:
          type: string
        fileType:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        uploader:
          $ref: "#/components/schemas/User"
          nullable: true

    PaginatedFiles:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/FileUpload"
        meta:
          $ref: "#/components/schemas/Meta"
    UploadFileRequest:
      type: object
      required:
        - file
        - patientId
      properties:
        file:
          type: string
          format: binary
        patientId:
          type: string
          format: uuid
    ImportPatientsResponse:
      type: object
      required: [success, processed, successCount, errorCount, errors]
      properties:
        success:
          type: boolean
        processed:
          type: integer
        successCount:
          type: integer
        errorCount:
          type: integer
        errors:
          type: array
          items:
            type: object
            required: [row, error]
            properties:
              row:
                type: integer
              error:
                type: string

    ImportPatientsRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary

    ProgramEnrollment:
      type: object
      required: [id, tenantId, patientId, programId, status, enrolledAt, createdAt, updatedAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        patientId:
          type: string
        programId:
          type: string
        enrolledAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [ACTIVE, COMPLETED, CANCELLED]
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        program:
          $ref: "#/components/schemas/Program"

    ProgramEnrollmentList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProgramEnrollment"
        meta:
          $ref: "#/components/schemas/Meta"

    ProgramEnrollmentInput:
      type: object
      required: [patientId, programId]
      properties:
        patientId:
          type: string
        programId:
          type: string
        notes:
          type: string

    ProgramEnrollmentUpdate:
      type: object
      properties:
        notes:
          type: string

    EnrollmentStats:
      type: object
      required: [totalEnrollments, activeEnrollments, completedEnrollments, enrollmentsByProgram]
      properties:
        totalEnrollments:
          type: integer
        activeEnrollments:
          type: integer
        completedEnrollments:
          type: integer
        enrollmentsByProgram:
          type: array
          items:
            $ref: "#/components/schemas/ProgramCount"
