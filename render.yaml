version: "1"

services:
  # ─── Backend API ──────────────────────────────────
  - name: caremesh-api
    type: web
    runtime: node
    region: singapore
    plan: free
    rootDir: artifacts/api-server
    buildCommand: "npm install -g pnpm && pnpm install && npx prisma generate && pnpm run build"
    startCommand: "node dist/index.mjs"
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: LOG_LEVEL
        value: info

  # ─── Frontend Static Site ─────────────────────────
  - name: caremesh-web
    type: web
    runtime: static
    region: singapore
    plan: free
    rootDir: artifacts/web
    buildCommand: "npm install -g pnpm && pnpm install && pnpm run build"
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: "no-cache"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
