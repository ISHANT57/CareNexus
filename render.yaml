version: "1"

# Backend only. The frontend is deployed separately on Vercel (see artifacts/web/vercel.json),
# which proxies /api/* to this service so the SPA stays same-origin (cookie auth works, no CORS).

services:
  # ─── Backend API ──────────────────────────────────
  - name: caremesh-api
    type: web
    runtime: node
    region: frankfurt          # EU region — closer to UK/EU data-residency needs for healthcare data
    # IMPORTANT: the API runs always-on background jobs (SyncWorker + nightly RiskScheduler cron).
    # The Render "free" plan spins down on idle, which stops those jobs and makes the first
    # request after idle slow/cold. Use "starter" (or higher) so the service never sleeps.
    plan: starter
    rootDir: artifacts/api-server
    buildCommand: "corepack enable && pnpm install && npx prisma generate && pnpm run build"
    startCommand: "node dist/index.mjs"
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"          # Render injects PORT; the app must listen on process.env.PORT
      - key: DATABASE_URL
        sync: false             # set to your Neon/managed Postgres connection string (with ?sslmode=require)
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false             # set to your Vercel URL, e.g. https://caremesh.vercel.app (belt-and-braces)
      - key: LOG_LEVEL
        value: info
