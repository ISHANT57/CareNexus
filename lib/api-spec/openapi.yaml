      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportPatientsRequest"
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPatientsResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    Meta:
      type: object
      required: [total, page, limit, pages]
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        pages:
          type: integer

    # ── Auth ────────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RegisterInput:
      type: object
      required: [tenantName, tenantDomain, firstName, lastName, email, password]
      properties:
        tenantName:
          type: string
        tenantDomain:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string

    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string

    AuthResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/AuthUser"

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, role, tenantId]
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        avatarUrl:
          type: ["string", "null"]
        role:
          type: string
        tenantId:
          type: string
        tenantName:
          type: string

    # ── Tenant ──────────────────────────────────────────────────────────────
    Tenant:
      type: object
      required: [id, name, domain, status, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        domain:
          type: string
        logoUrl:
          type: ["string", "null"]
        status:
          type: string
        createdAt:
          type: string

    TenantInput:
      type: object
      required: [name, domain]
      properties:
        name:
          type: string
        domain:
          type: string
        logoUrl:
          type: string

    TenantUpdate:
      type: object
      properties:
        name:
          type: string
        domain:
          type: string
        logoUrl:
          type: string
        status:
          type: string

    TenantList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        meta:
          $ref: "#/components/schemas/Meta"

    # ── Area ────────────────────────────────────────────────────────────────
    Area:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string

    AreaInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    AreaUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    AreaList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Area"
        meta:
          $ref: "#/components/schemas/Meta"

    # ── Clinic ──────────────────────────────────────────────────────────────
    Clinic:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        createdAt:
          type: string
        area:
          $ref: "#/components/schemas/Area"

    ClinicInput:
      type: object
