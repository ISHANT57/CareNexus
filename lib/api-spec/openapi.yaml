  /risk-scores:
    get:
      operationId: listRiskScores
      tags: [riskScores]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
        - name: riskLevel
          in: query
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, CRITICAL]
      responses:
        "200":
          description: Patients with risk scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientRiskScoreList"

  /risk-scores/recalculate-all:
    post:
      operationId: recalculateAllRiskScores
      tags: [riskScores]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bulk recalculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkRecalculateResult"

  /risk-scores/{patientId}:
    get:
      operationId: getPatientRiskScore
      tags: [riskScores]
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Risk score details with factors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientRiskScoreDetail"

  /risk-scores/{patientId}/calculate:
    post:
      operationId: calculatePatientRiskScore
      tags: [riskScores]
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Recalculated risk score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientRiskScore"
