          $ref: "#/components/schemas/Meta"

    CareTaskInput:
      type: object
      required: [patientId, assignedTo, title, dueDate]
      properties:
        patientId: { type: string }
        assignedTo: { type: string }
        title: { type: string }
        description: { type: string }
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
