version: "1"

# Backend only. The frontend is deployed separately on Vercel (see artifacts/web/vercel.json),
# which proxies /api/* to this service so the SPA stays same-origin (cookie auth works, no CORS).

services:
  # ─── Backend API ──────────────────────────────────
  - name: caremesh-api
    type: web
    runtime: node
    region: frankfurt          # EU region — closer to UK/EU data-residency needs for healthcare data
    # NOTE: the API runs always-on background jobs (SyncWorker + nightly RiskScheduler cron).
    # "free" spins down after ~15 min idle, which pauses those jobs and makes the first
    # request after idle slow/cold (~30-60s). Mitigated with a keep-alive ping from
    # .github/workflows/keep-alive.yml (hits /api/healthz every 10 min) — not bulletproof,
    # but keeps the service warm for normal use. Bump to "starter" for a guaranteed always-on
    # cron/no cold starts.
    plan: free
    rootDir: artifacts/api-server
    # Render's build image has BOTH /usr/bin and /usr/lib/node_modules mounted
    # read-only, so no global install works here — neither `corepack enable`
    # nor `npm install -g pnpm`. Run pnpm via `npx` instead: it caches the
    # package in a writable temp dir rather than a system path.
    buildCommand: "npx --yes pnpm@11 install && npx --yes pnpm@11 exec prisma generate && npx --yes pnpm@11 run build"
    startCommand: "node dist/index.mjs"
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"          # Render injects PORT; the app must listen on process.env.PORT
      - key: DATABASE_URL
        sync: false             # set to your Neon/managed Postgres connection string (with ?sslmode=require)
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false             # set to your Vercel URL, e.g. https://caremesh.vercel.app (belt-and-braces)
      - key: LOG_LEVEL
        value: info
