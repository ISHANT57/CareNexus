          type: string
          enum: [PENDING, IN_PROGRESS, COMPLETED, OVERDUE]
        dueDate: { type: string, format: date-time }
        completedAt:
          type: string
          format: date-time
          nullable: true
        isOverdue: { type: boolean }
        deletedAt:
          type: string
          format: date-time
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        patient:
          type: object
          nullable: true
          properties:
            id: { type: string }
            firstName: { type: string }
            lastName: { type: string }
            nhsNumber: { type: string, nullable: true }
        creator:
          type: object
          nullable: true
          properties:
            id: { type: string }
            firstName: { type: string }
            lastName: { type: string }
        assignee:
          type: object
          nullable: true
          properties:
            id: { type: string }
            firstName: { type: string }
            lastName: { type: string }

    CareTaskList:
      type: object
      required: [data, meta]
      properties:
