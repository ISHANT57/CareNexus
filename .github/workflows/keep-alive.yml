name: Keep Render backend warm

# Render's free plan spins the service down after ~15 min idle, which pauses
# the SyncWorker and the nightly RiskScheduler cron. This pings the health
# endpoint often enough to keep it warm for normal use. Not a guarantee —
# GitHub's scheduler can lag during high load — but works for low-traffic use.
#
# Fill in RENDER_API_URL below once you have your real Render URL (Step 2 of
# DEPLOYMENT.md), e.g. https://caremesh-api.onrender.com

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

env:
  RENDER_API_URL: "https://caremesh-api.onrender.com"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit health check
        run: curl -fsS "${{ env.RENDER_API_URL }}/api/healthz"
