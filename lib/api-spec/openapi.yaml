        dueDate: { type: string, format: date-time }

    CareTaskUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        status:
